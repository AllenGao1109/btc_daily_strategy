# Monthly factor-decay monitor: refreshes mirror data, runs factor_monitor.py,
# commits the run log, and opens an issue when the pre-registered split-roll
# tripwire is armed or fires. See factor_monitor.py for the tripwire rules.
name: factor-monitor

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data caches from public mirrors
        run: python3 fetch_mirror_data.py

      - name: Run the decay monitor and tripwire
        id: monitor
        run: |
          python3 factor_monitor.py | tee monitor_output.txt
          {
            echo "verdict<<EOF"
            grep -A2 "^Tripwire:" monitor_output.txt || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit the monitor run log
        run: |
          git config user.name "factor-monitor[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git add results/factor_monitor_log.csv
          git diff --cached --quiet || git commit -m "monitor: monthly run log"
          git push

      - name: Open an issue if the tripwire is armed or fired
        if: contains(steps.monitor.outputs.verdict, 'ROLL') || contains(steps.monitor.outputs.verdict, 'armed')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Factor monitor tripwire: action may be required"
          gh issue create --title "$TITLE" \
            --body "$(printf 'The monthly factor monitor reported:\n\n```\n%s\n```\n\nSee factor_monitor.py for the pre-registered split-roll rules and RESEARCH_FINDINGS.md for context.' "${{ steps.monitor.outputs.verdict }}")" \
            || true
