data:
  source: "cryptocompare"
  exchange: "coinbase"
  symbol: "BTC/USD"
  timeframe: "1d"
  start_date: "2017-01-01"
  end_date: null
  timezone: "UTC"

portfolio:
  initial_capital: 10000
  # 2026-06: owner lowered the fee assumption 0.5% -> 0.2% per side (closer to
  # spot taker tiers; still conservative vs perp maker/taker). The band below
  # was re-selected for this fee level.
  fee_rate: 0.002
  slippage_rate: 0.0
  cash_return: 0.0

exposure:
  allow_long: true
  allow_short: true
  allow_leverage: true
  min_weight: -2.0
  max_weight: 2.0
  max_leverage: 2.0

backtest:
  execution_lag_days: 1
  rebalance_policy: "signal_change_or_risk_control"
  leverage_breach_action: "delever_next_day"
  stop_trading_if_equity_zero: true
  # No-trade band. At fee 0.5% the band was 0.30 (see git history). With the
  # fee lowered to 0.2% the turnover penalty halves and the 2026-06 grid
  # (bands 0.30/0.20/0.10 x strategies, selection on train+val only) picks
  # 0.20 back: best validation Sharpe (1.31 vs 1.15 at 0.30), tv-mean 1.32,
  # worst-year -0.88, full-sample MaxDD -47%. 0.10 had a higher tv-mean (1.39)
  # but lower validation Sharpe and ~3x the trades — the (weakened) fee prior
  # breaks the tie toward 0.20. Test, checked only after selection: 0.97/1.96,
  # beats buy-and-hold on both. Caveat on record: the 0.30 variant's test was
  # higher (1.07/2.22) — the 2024-26 window keeps rewarding slower trading;
  # tracked by factor_monitor, not acted on (that would be test-peeking).
  weight_band: 0.20

funding:
  enabled: true
  long_borrow_rate_daily: 0.0
  short_borrow_rate_daily: 0.0
  perp_funding_rate_daily: 0.0

validation:
  train_start: "2017-01-01"
  train_end: "2021-12-31"
  validation_start: "2022-01-01"
  validation_end: "2023-12-31"
  test_start: "2024-01-01"
  test_end: null
  walk_forward: true

strategy:
  # factor_composite is the first strategy to beat buy-and-hold on BOTH Sharpe
  # and NAV out-of-sample, robustly and deterministically, under disciplined
  # (no-test-peek) selection. It combines factors whose information coefficient
  # is stable across train+validation: BTC halving-cycle phase, return kurtosis,
  # volatility regime, MVRV valuation, long-horizon momentum, exchange net-flow,
  # and BTC-vs-ETH relative strength. Out-of-sample test (2024-2026):
  #   factor_composite: Sharpe 0.98, NAV 2.00, MaxDD -26%
  #   buy_and_hold:     Sharpe 0.58, NAV 1.50, MaxDD -50%
  # Train+val years mean-yearly Sharpe 1.41 vs BH 1.12. ~84 trades. The edge is
  # broad-based (4/8 win years) and strongest in bear years (downside protection).
  # 2026-06 update: added cnnfg_z_60 (CNN equity Fear & Greed 60d z-score,
  # contrarian) to DEFAULT_FACTORS. Selected on train+val only (val Sharpe
  # 1.05 -> 1.12); test confirmed afterwards (1.02/2.05 -> 1.04/2.16 on the
  # CoinMetrics-mirror data snapshot). See RESEARCH_FINDINGS.md.
  # 2026-06 update 2: production is now composite_blend = 0.75 x the composite
  # + 0.25 x trend_ensemble (strategy-level diversification). Selected on
  # train+val at fee 0.2% / band 0.20: validation Sharpe 1.47 vs 1.31, best
  # worst-year (-0.52), FEWER trades than the composite alone (145 vs 167 —
  # weight averaging nets opposing trades). Test, checked after selection,
  # agreed: 1.08/2.17 vs 0.97/1.96. Statistical caveat on record (see
  # RESEARCH_FINDINGS.md): no window's edge over buy-and-hold is statistically
  # significant; deflated-Sharpe P[skill] 0.13-0.63.
  # 2026-06 update 3: ELR de-leveraging overlay added to composite_blend.
  # System leverage (CryptoQuant Estimated Leverage Ratio) is the strongest
  # standalone IC in the 107-factor library but added nothing inside the
  # return composite (a risk factor, not a return factor). As a position
  # overlay (scale down when ELR's 180d z-score stretches above z0), selected
  # on train+val across a 2x2 grid: validation Sharpe 1.47 -> 1.64 with every
  # grid corner improving, validation MaxDD -25% -> -17%; tie-break by fewer
  # trades picked z0=0.5/k=0.5. Test, read after selection: Sharpe ~flat
  # (1.06 vs 1.08), test MaxDD improved (-20% vs -26%), NAV gave back some
  # upside (1.91 vs 2.17) - the risk improvement is confirmed, the return
  # cost is the price of the insurance.
  name: "composite_blend"
  params:
    blend: 0.75               # weight on the composite leg (1-x on ensemble)
    # ELR overlay REMOVED from production (owner decision 2026-06): the only
    # free ELR source is a static archive (last stamp 2026-04-10) that cannot
    # be kept fresh, and a production model must not depend on a feed we
    # cannot sustain. The overlay itself remains implemented, tested and
    # validated (val Sharpe 1.47 -> 1.64 when live data existed); re-enable
    # by setting elr_overlay: true once a sustainable feed exists (free
    # OI/reserve proxy needs ~6 months of collection, or CryptoQuant
    # Professional ~$99/mo). See RESEARCH_FINDINGS.md.
    elr_overlay: false
    train_end: "2021-12-31"   # factor signs use only data <= this (no lookahead)
    horizon: 20
    tilt: 0.5
    target_vol: 0.55
    vol_window: 45
    max_weight: 2.0

report:
  output_dir: "reports"
  include_charts: true
