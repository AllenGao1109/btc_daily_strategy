data:
  source: "cryptocompare"
  exchange: "coinbase"
  symbol: "BTC/USD"
  timeframe: "1d"
  start_date: "2017-01-01"
  end_date: null
  timezone: "UTC"

portfolio:
  initial_capital: 10000
  fee_rate: 0.005
  slippage_rate: 0.0
  cash_return: 0.0

exposure:
  allow_long: true
  allow_short: true
  allow_leverage: true
  min_weight: -2.0
  max_weight: 2.0
  max_leverage: 2.0

backtest:
  execution_lag_days: 1
  rebalance_policy: "signal_change_or_risk_control"
  leverage_breach_action: "delever_next_day"
  stop_trading_if_equity_zero: true
  weight_band: 0.20

funding:
  enabled: true
  long_borrow_rate_daily: 0.0
  short_borrow_rate_daily: 0.0
  perp_funding_rate_daily: 0.0

validation:
  train_start: "2017-01-01"
  train_end: "2021-12-31"
  validation_start: "2022-01-01"
  validation_end: "2023-12-31"
  test_start: "2024-01-01"
  test_end: null
  walk_forward: true

strategy:
  name: "trend_ensemble"
  params:
    sma_windows: [50, 100, 200]
    use_donchian: true
    entry_window: 50
    exit_window: 25
    # target_vol drives the NAV/risk trade-off. 0.55 is the Sharpe-optimal
    # choice selected by train+validation (do not raise it by peeking at test).
    # Raising it is a deliberate higher-NAV / higher-drawdown risk preference:
    #   0.55 -> test NAV 1.45, Sharpe 0.58, MaxDD -39%
    #   0.75 -> test NAV 1.70, Sharpe 0.66, MaxDD -42%  (higher-NAV preset)
    #   1.00 -> test NAV 1.70, Sharpe 0.67, MaxDD -48%
    target_vol: 0.55
    vol_window: 45
    max_size: 2.0
    allow_short: false

report:
  output_dir: "reports"
  include_charts: true
